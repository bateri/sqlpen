# Releases what a commit on main has prepared (RELEASING.md). It runs when the gate (check.yml) has
# finished green on a push to main, and when it is started by hand:
#
# - plan: whether the version in Cargo.toml has no tag yet (`make release-prepare`,
#   committed and pushed). A commit that moved no version ends here. While Cargo.lock takes pencere
#   at a commit and not at a release of it on crates.io, plan refuses: a release is built with a
#   published pencere.
# - build: the three files, each built on a runner of its own system and architecture (no
#   emulation, no cross toolchain), from nothing: no cache. Cargo builds pencere into each from the
#   source Cargo.lock names; nothing of pencere's is downloaded ready-made.
# - sums: the three together, summed, checked and attested (provenance).
# - draft: the tag `v<version>` and the GitHub release as a draft, with the changelog section as its
#   notes and the files.
# - publish: waits in the `release` environment for a maintainer to approve it, refuses an
#   environment with no required reviewers, checks the draft's files against their sums and
#   attestations, and makes it public as the Latest.
#
# Started by hand on main, it finishes a release that stopped half way (tagged on this commit, not
# yet public), if the gate is green on it. With `rehearse` it only builds, on any branch, and keeps
# the files as a workflow artifact: no tag, no release, no attestation.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearse:
        description: Only build and check; tag and publish nothing
        type: boolean
        default: false

# One release at a time, and none is cut short by the next.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # A run of the gate on a pull request, or on a branch of a fork named main, is never a release.
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      rehearse: ${{ steps.sha.outputs.rehearse }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: sha
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REHEARSE: ${{ inputs.rehearse == true }}
        run: |
          if [ "$EVENT" = workflow_run ]; then
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
            echo "rehearse=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$REHEARSE" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::a release is made from main; start it on main, or rehearse"
              exit 1
            fi
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "rehearse=$REHEARSE" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # After the gate's run, this commit is green; started by hand, plan asks GitHub whether it is.
      - id: plan
        if: steps.sha.outputs.rehearse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESUME: ${{ github.event_name == 'workflow_dispatch' }}
          RELEASE_REQUIRE_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: node tools/release.mjs plan >> "$GITHUB_OUTPUT"

  # The three files, each on a runner of its own system and architecture: the Linux ones linked
  # statically with musl. Nothing is taken from a cache: what is released is built from nothing.
  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' || needs.plan.outputs.rehearse == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make dist TARGET=${{ matrix.target }}
      # Where the runner can run what it built: it says the version it is.
      - run: ./dist/release/sqlpen-*-${{ matrix.target }} --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error

  # The three together: their sums, the checks of release.mjs, and the attestation that this
  # workflow built each.
  sums:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/release
      - run: chmod +x dist/release/sqlpen-* && make sums
      - if: needs.plan.outputs.rehearse != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/sqlpen-*
            dist/release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/release/
          if-no-files-found: error

  # The tag, and the GitHub release as a draft. A job that is run again leaves a tag that is on
  # this commit and makes the draft again; a release that is public is not touched.
  draft:
    needs: [plan, sums]
    if: needs.sums.result == 'success' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/release.mjs tag
          node tools/release.mjs draft dist/release

  # Waits for a maintainer's approval in the `release` environment (Settings, Environments: its
  # required reviewers); nothing is public before it.
  publish:
    needs: [plan, draft]
    if: needs.draft.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: release
        run: node tools/release.mjs publish
